<style>:root{
  --bg:#150a1f; --bg2:#1b0f29; --card:#231436; --card2:#2c1942; --line:rgba(255,255,255,.07);
  --txt:#fbf4ff; --mut:#b9a8c9; --dim:#7f6b93;
  --lime:#ff6fb5; --cyan:#c9a7ff; --pink:#ff5c8a; --amber:#ffb547; --violet:#b46cff;
  --r:20px; --r2:14px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tabh:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,rgba(168,85,247,.28),transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--safe-t) + 14px) 20px 12px;background:linear-gradient(var(--bg) 60%,rgba(21,10,31,.0));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tb-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.tb-title{margin:2px 0 0;background:linear-gradient(90deg,#ff8cc6,#b46cff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:30px;font-weight:800;letter-spacing:-.02em}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--mut);transition:transform .15s var(--ease)}
.icon-btn:active{transform:scale(.92)}

.view{padding:4px 16px calc(var(--tabh) + var(--safe-b) + 96px);max-width:640px;margin:0 auto}
.view.enter{animation:viewIn .38s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;position:relative;overflow:hidden}
.card.pad-s{padding:14px}
.card h2,.sec-h{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sec-h{margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec-h small{font-weight:600;letter-spacing:0;text-transform:none;color:var(--dim)}
.muted{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stagger>*{animation:rise .45s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* hero */
.hero{background:radial-gradient(400px 220px at 100% 0,rgba(201,167,255,.16),transparent 70%),radial-gradient(380px 240px at 0 100%,rgba(255,111,181,.14),transparent 70%),var(--card);padding:20px}
.hero .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.lime{color:#150a1f;background:var(--lime);border-color:transparent}
.chip.cyan{color:var(--cyan);background:rgba(201,167,255,.1);border-color:rgba(201,167,255,.25)}
.chip.amber{color:var(--amber);background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;font-size:16px;background:var(--card2);border:1px solid var(--line);transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,#ff6fb5,#c084fc);color:#150a1f;border-color:transparent;box-shadow:0 8px 28px -10px rgba(255,111,181,.6)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--pink)}

/* rings */
.rings{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.07)}
.ring .fg{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring .ctr{position:absolute;text-align:center;line-height:1.05}
.ring .ctr b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ring .ctr span{font-size:11px;color:var(--mut);font-weight:600}
.minirings{display:grid;gap:10px}
.mr{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.mr .ctr b{font-size:11px}
.mr .lbl{font-size:13px;font-weight:700}
.mr .val{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;width:0;transition:width .9s var(--ease)}

/* list rows */
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-weight:650;font-size:15.5px}
.item .s{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.badge{min-width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;background:rgba(255,111,181,.12);color:var(--lime);flex:none}
.badge.c{background:rgba(201,167,255,.12);color:var(--cyan)} .badge.a{background:rgba(255,181,71,.12);color:var(--amber)} .badge.v{background:rgba(180,108,255,.14);color:var(--violet)}
.kc{text-align:right;flex:none}
.kc b{display:block;font-size:15px} .kc span{font-size:12px;color:var(--mut)}

.check{width:30px;height:30px;border-radius:10px;border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;flex:none;transition:all .2s var(--ease)}
.check svg{width:16px;height:16px;stroke:#150a1f;stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.on>.check,.check.on{background:var(--lime);border-color:var(--lime)}
.on>.check svg,.check.on svg{opacity:1;transform:none}
.on .t{color:var(--mut)}
.tap{cursor:pointer;user-select:none}
.tap:active{opacity:.75}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--mut)}
.inp{height:52px;width:100%;border-radius:14px;background:var(--bg);border:1px solid var(--line);padding:0 14px;font-size:18px;font-weight:700;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(255,111,181,.6)}
input[type=date].inp{font-size:16px;color-scheme:dark}
.inp-row{display:flex;gap:10px;align-items:flex-end}

/* day picker */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{height:58px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut);transition:all .2s var(--ease)}
.days button i{font-style:normal;font-size:10px;font-weight:600;color:var(--dim)}
.days button.sel{background:var(--lime);color:#150a1f;border-color:transparent}
.days button.sel i{color:rgba(21,10,31,.6)}
.days button.today:not(.sel){border-color:rgba(255,111,181,.45);color:var(--txt)}

/* session picker */
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.spill{flex:none;height:42px;padding:0 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
.spill.sel{background:rgba(255,111,181,.12);color:var(--lime);border-color:rgba(255,111,181,.4)}
.spill .lk{font-size:11px;opacity:.7}

/* exercise */
.ex{padding:0}
.ex-head{display:flex;gap:14px;padding:16px;align-items:center}
.ex-head .grow{padding-right:30px}
.ex-img{width:72px;height:72px;border-radius:14px;flex:none;object-fit:cover;background:#fff;border:1px solid var(--line)}
.ex-img.none{display:grid;place-items:center;background:var(--card2);color:var(--dim);font-size:26px}
.ex-name{font-size:17px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ex-num{position:absolute;top:12px;right:14px;font-size:12px;font-weight:800;color:var(--dim)}
.ex.done{border-color:rgba(255,111,181,.35)}
.ex.done .ex-num{color:var(--lime)}
.hint{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:rgba(201,167,255,.07);border:1px solid rgba(201,167,255,.16);font-size:13px;color:#eadcff;line-height:1.4}
.hint.up{background:rgba(255,111,181,.08);border-color:rgba(255,111,181,.2);color:#ffd1ea}
.sets{padding:0 12px 14px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center;padding:6px;border-radius:14px;background:rgba(255,255,255,.025);transition:background .25s}
.set .n{font-size:13px;font-weight:800;color:var(--dim);text-align:center}
.set .inp{height:46px;font-size:17px;text-align:center;padding:0 6px}
.set .unit{position:relative}
.set .unit::after{content:attr(data-u);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);font-weight:700;pointer-events:none}
.set-btn{height:46px;border-radius:13px;border:2px solid rgba(255,255,255,.16);display:grid;place-items:center;transition:all .2s var(--ease)}
.set-btn svg{width:20px;height:20px;stroke:var(--dim);stroke-width:3;fill:none;transition:all .2s}
.set.on{background:rgba(255,111,181,.07)}
.set.on .set-btn{background:var(--lime);border-color:var(--lime);animation:pop .35s var(--ease)}
.set.on .set-btn svg{stroke:#150a1f}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.sets-h{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;padding:0 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:center}

.progress-line{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:14px}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));width:0;transition:width .6s var(--ease);border-radius:inherit}

.callout{border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:14px}
.callout b{color:var(--txt)}
.callout.lime{background:rgba(255,111,181,.06);border-color:rgba(255,111,181,.18)}
.callout.amber{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.2)}
.callout.cyan{background:rgba(201,167,255,.06);border-color:rgba(201,167,255,.18)}

/* meals */
.meal{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal .slot{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim)}
.meal .t{font-weight:700;font-size:16px;margin-top:2px}
.meal .s{font-size:13px;color:var(--mut);line-height:1.4;margin-top:4px}
.meal .note{display:inline-block;margin-top:6px}
.macros{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.macros b{color:var(--txt);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:4px;border-top:1px dashed rgba(255,255,255,.12);font-size:13px;color:var(--mut)}
.total b{font-size:20px;color:var(--lime)}
details.lib{border-top:1px solid var(--line);padding:12px 0}
details.lib:first-of-type{border-top:0}
details.lib summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
details.lib summary::-webkit-details-marker{display:none}
details.lib p{margin:10px 0 0 50px;font-size:13px;color:var(--mut);line-height:1.45}

/* grocery */
.g-item{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.g-item:first-of-type{border-top:0}
.g-item .t{font-weight:650;font-size:15px;transition:color .2s}
.g-item .q{color:var(--lime);font-weight:700;font-size:13px;margin-top:2px}
.g-item .s{font-size:12px;color:var(--dim);margin-top:2px}
.g-item.on .t{text-decoration:line-through;color:var(--dim)}
.g-item.on .q{color:var(--dim)}

/* cook */
.step{display:grid;grid-template-columns:30px 50px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step .tm{font-size:12px;font-weight:800;color:var(--cyan);padding-top:6px}
.step .tx{font-size:14px;line-height:1.45;padding-top:4px}
.step.on .tx{color:var(--dim);text-decoration:line-through}
.cook-card.next{border-color:rgba(255,111,181,.35);box-shadow:0 0 0 1px rgba(255,111,181,.1),0 20px 40px -24px rgba(255,111,181,.35)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.stat .d{font-size:12px;font-weight:700}
.up{color:var(--pink)} .down{color:var(--lime)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:rgba(255,255,255,.06)}
.chart .axis{fill:var(--dim);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tg div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.tg b{display:block;font-size:17px;font-weight:800}
.tg span{font-size:11px;color:var(--mut);font-weight:600}
.hist{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:6px;font-size:13px;align-items:center}
.hist.h{font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
.hist-row{padding:10px 0;border-top:1px solid var(--line)}
.hist .dt{font-weight:700}
table.ramp{width:100%;border-collapse:collapse;font-size:13px}
table.ramp td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top}
table.ramp tr:first-child td{border-top:0}
table.ramp tr.cur td{color:var(--lime)}
table.ramp td:first-child{font-weight:700;white-space:nowrap}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(24,12,36,.82);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:650;color:var(--dim);transition:color .2s;position:relative;z-index:1}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.tabbar a.act{color:var(--lime)}
.tabbar a.act svg{transform:translateY(-1px) scale(1.06)}
.tab-ind{position:absolute;top:0;height:2px;width:calc(100%/6);background:var(--lime);border-radius:0 0 3px 3px;box-shadow:0 0 14px var(--lime);transition:transform .35s var(--ease)}

/* timer */
.timer{position:fixed;z-index:29;left:12px;right:12px;bottom:calc(var(--tabh) + var(--safe-b) + 10px);max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 8px;border-radius:20px;background:rgba(44,25,66,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,111,181,.25);box-shadow:0 20px 40px -10px rgba(0,0,0,.7);animation:slideUp .35s var(--ease)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.timer-ring{width:44px;height:44px;transform:rotate(-90deg);flex:none}
.tr-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4}
.tr-fg{fill:none;stroke:var(--lime);stroke-width:4;stroke-linecap:round;stroke-dasharray:119.4;transition:stroke-dashoffset 1s linear}
.timer-txt{display:flex;flex-direction:column;flex:1;line-height:1.1}
.timer-label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.timer-time{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.timer-btn{height:42px;min-width:46px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:700;font-size:14px}
.timer-btn.skip{background:var(--lime);color:#150a1f}
.timer.done{border-color:var(--lime);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,111,181,.15),0 20px 40px -10px rgba(0,0,0,.7)}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(24px + var(--safe-b));animation:sheetUp .35s var(--ease);max-width:640px;margin:0 auto}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800}
.sheet .grp{margin-top:18px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
.lightbox img{max-width:100%;max-height:70vh;border-radius:18px;background:#fff}
.lb-cap{margin-top:14px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-80px);z-index:70;background:var(--lime);color:#150a1f;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;transition:transform .35s var(--ease);pointer-events:none;box-shadow:0 10px 30px -8px rgba(255,111,181,.6)}
.toast.show{transform:translate(-50%,0)}

.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:40px;margin-bottom:8px}
.done-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(255,111,181,.16),rgba(201,167,255,.12));border:1px solid rgba(255,111,181,.3);margin-bottom:14px;font-weight:700;animation:rise .4s var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>/* ShredHer: onboarding + personalization. Runs after data.js, before app.js. */
(() => {
'use strict';
const PKEY = 'shredher.profile.v1';
const P = window.PLAN;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getProfile = () => { try { return JSON.parse(localStorage.getItem(PKEY)); } catch (e) { return null; } };
const ACT = { sedentary: [1.2, 'Mostly sitting (desk job, little exercise)'], light: [1.375, 'Lightly active (walks, 1–3 workouts/wk)'], moderate: [1.55, 'Moderately active (3–5 workouts/wk)'], very: [1.725, 'Very active (6–7 workouts/wk or active job)'] };
const GOALS = { lose: 'Lose fat', tone: 'Tone up', build: 'Build muscle' };
const EXP = { beginner: 'Beginner (new to lifting)', intermediate: 'Intermediate (6+ months)', advanced: 'Advanced (2+ years)' };

function compute(p){
  const kg = p.weight * 0.453592, cm = (p.ft * 12 + p.inch) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * p.age - 161;            // Mifflin-St Jeor (female)
  const tdee = bmr * 1.45;                                        // light-moderate activity
  const kcal = Math.round(Math.max(1200, tdee * 0.825) / 10) * 10; // ~17.5% deficit
  const protein = Math.round(p.weight * 0.8);
  const fat = Math.round(kcal * 0.28 / 9);
  const carbs = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, fat, carbs };
}
window.SHREDHER = { PKEY, getProfile, compute, open: () => showOnboarding(getProfile()) };

function personalize(p){
  p = Object.assign({ goal: 'lose', days: 3, exp: 'beginner', goalWeight: p.weight }, p);
  const t = compute(p);
  P.profile = p;
  P.targets = Object.assign({}, P.targets, { kcal: t.kcal, protein: t.protein, fat: t.fat, carbs: t.carbs });
  const lbs = Math.abs(p.weight - (p.goalWeight || p.weight));
  const rate = p.goal === 'lose' ? 0.75 : p.goal === 'build' ? 0.4 : 0.5;
  P.goal = `${GOALS[p.goal]} · ${p.weight} lb → ${p.goalWeight || p.weight} lb` + (lbs ? ` (~${Math.ceil(lbs / rate)} weeks at ~${rate} lb/week)` : '') + `. BMR ${t.bmr} · maintenance ≈${t.tdee} kcal.`;
  P.weighIn = `Weigh in every morning (after bathroom, before food). Compare week over week${p.goal === 'lose' ? ': aim for −0.5 to −1 lb' : p.goal === 'build' ? ': aim for +0.25 to +0.5 lb' : ''}. Cycle-related water swings are normal — trust the weekly average.`;
  // Scale plan meals to her calories (plan was built around ~1,975 kcal)
  const f = Math.min(1.4, Math.max(0.55, t.kcal / 1975));
  Object.values(P.meals).forEach(m => { ['kcal','protein','fat','carbs','sodium'].forEach(k => m[k] = Math.round(m[k] * f)); if (Math.abs(f - 1) > 0.04) m.what += ` — portions ×${f.toFixed(2)} to fit ${t.kcal} kcal`; });
  P.week.forEach(d => { const s = ['breakfast','lunch','snack','dinner'].map(k => P.meals[d[k][0]]); const sum = k => s.reduce((a, m) => a + m[k], 0); d.total = `${sum('kcal').toLocaleString()} kcal · ${sum('protein')} g P · ${sum('fat')} g F · ${sum('carbs')} g C`; d.tag = ''; });
  P.weeklyAvg = `≈${t.kcal.toLocaleString()} kcal · ${t.protein} g protein · ${t.fat} g fat · ${t.carbs} g carbs per day. Meal portions are scaled automatically from your profile.`;
  if (p.diet) P.mealsHow = `Your preferences: ${p.diet}. Swap any food that doesn't fit for one with similar protein/carbs (e.g. tofu/tempeh/seitan for meat, lactose-free or soy yogurt for Greek yogurt, rice ↔ potato ↔ oats). ` + P.mealsHow.replace(/^Every meal uses only foods you already eat\. /, '');
  // Training schedule by days/week (0=Sun)
  const LAYOUT = {
    2: [[1,'legs-arm'],[4,'back-abs']],
    3: [[1,'legs-arm'],[3,'back-abs'],[5,'chest-shoulders']],
    4: [[1,'legs-arm'],[2,'back-abs'],[4,'legs-arms'],[5,'chest-shoulders']],
    5: [[1,'legs-arm'],[2,'back-abs'],[3,'chest-shoulders'],[5,'legs-arms'],[6,'chest-abs']],
    6: [[1,'legs-arm'],[2,'back-abs'],[3,'chest-shoulders'],[4,'legs-arms'],[5,'back'],[6,'chest-abs']]
  };
  const lay = LAYOUT[p.days] || LAYOUT[3];
  const used = new Set(lay.map(x => x[1]));
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const free = [0,1,2,3,4,5,6].filter(d => !lay.some(x => x[0] === d));
  P.schedule = lay.map(([dow, session]) => ({ dow, session, from: 1 }));
  // Sessions not in her week stay pickable as "extra" days (placed on a free day label, never auto-scheduled on Sunday)
  Object.keys(P.sessions).filter(id => !used.has(id)).forEach((id, i) => P.schedule.push({ dow: -1, label: free[i % free.length], session: id, from: 1, extra: true }));
  P.schedule.forEach(e => { if (e.dow >= 0) P.sessions[e.session].day = DOW[e.dow]; });
  // Lighter sessions for her: max 4 exercises, max 3 sets, 10-15 reps
  Object.values(P.sessions).forEach(s => {
    s.exercises = s.exercises.slice(0, 4);
    s.exercises.forEach(ex => { ex.sets = Math.min(ex.sets, 3); if (ex.reps) { ex.reps = Math.min(15, Math.max(ex.reps, 10)); ex.target = `${ex.sets} x ${ex.reps}`; } });
    s.progression = 'Add 1–2 reps per set each week; when you hit 3×15 with good form, go up a little in weight.';
  });
  const split = lay.map(([d, s]) => `${DOW[d]} ${P.sessions[s].name}`).join(' · ');
  const r = { weeks: `${p.days} days/week`, lift: p.days, split, extras: p.goal === 'lose' ? '20–30 min walk on rest days' : '' };
  P.ramp = [r, r, r, r, { weeks: 'Sunday', from: 0, lift: 0, split: 'Rest / meal prep', extras: '' }];
  P.logistics = [`${p.days} lifting days per week, ~45–60 min each.`, 'Daily walk: 20–30 min. Aim for 8–10k steps.'];
  P.abRule = p.exp === 'beginner' ? 'Core work 3x/week: Cable crunches 3×12 · Leg raises 3×8. Progress to 3×15, then add weight.' : P.abRule;
  P.rule = `Judge progress by the weekly average weight, not daily readings. If it hasn't moved toward your goal in 2 weeks, ${p.goal === 'build' ? 'add ~100 kcal/day' : 'add a cardio session before cutting food'}.`;
  P.cookSummary = P.cookSummary.replace(/On Mon\/Wed\/Fri you get home after 8 PM, so dinner is a 2–3 min microwave reheat and nothing gets cooked\. /, '');
  P.rhythm = 'Pack breakfast and your lunch/snack bag the night before. Eat the snack ~1 hr before training. Dinner is a quick reheat on gym nights.';
}

function showOnboarding(p){
  p = p || {};
  const opt = (o, v) => Object.entries(o).map(([k, l]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${esc(Array.isArray(l) ? l[1] : l)}</option>`).join('');
  const el = document.createElement('div');
  el.id = 'onboard';
  el.innerHTML = `<style>
  #onboard{position:fixed;inset:0;z-index:999;background:#150a1f;color:#fbf4ff;overflow:auto;font-family:inherit;-webkit-overflow-scrolling:touch}
  #onboard .ob{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}
  #onboard h1{font-size:34px;margin:0 0 4px;letter-spacing:-.02em}#onboard h1 b{color:#ff6fb5}
  #onboard p.l{color:#b9a8c9;margin:0 0 22px;line-height:1.45}

  #onboard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #onboard .days{display:flex;gap:8px}#onboard .days button{flex:1;height:44px;border-radius:12px;border:1px solid #3a2452;background:#231436;color:#fbf4ff;font-size:16px;font-weight:700}
  #onboard .days button.on{background:#ff6fb5;color:#150a1f;border-color:#ff6fb5}
  #onboard .go{margin-top:26px;width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(90deg,#ff6fb5,#a855f7);color:#150a1f;font-size:17px;font-weight:800}
  #onboard .err{color:#ff6b6b;font-size:14px;margin-top:10px;min-height:18px}
  #onboard .x{float:right;background:none;border:0;color:#b9a8c9;font-size:15px}
  </style><form class="ob" novalidate>
  ${p.name ? '<button type="button" class="x" id="obX">Cancel</button>' : ''}
  <h1>Shred<b>Her</b></h1>
  <p class="l">${p.name ? 'Update your profile — targets and plan recalculate instantly.' : 'Welcome! Answer a few quick questions (just age, height and weight) and ShredHer works out your calories, macros and meals for you. Everything stays on this phone.'}</p>
  <label>First name (optional)</label><input name="name" value="${esc(p.name || '')}" placeholder="Your name" autocomplete="given-name">
  <div class="two"><div><label>Age</label><input name="age" type="number" inputmode="numeric" min="14" max="90" value="${p.age || ''}"></div>
  <div><label>Height</label><div class="two"><input name="ft" type="number" inputmode="numeric" min="4" max="7" placeholder="ft" value="${p.ft ?? ''}"><input name="inch" type="number" inputmode="numeric" min="0" max="11" placeholder="in" value="${p.inch ?? ''}"></div></div></div>
  <div class="two"><div><label>Current weight (lb)</label><input name="weight" type="number" inputmode="decimal" min="70" max="500" step="0.1" value="${p.weight || ''}"></div></div>
  <div class="err" id="obErr"></div>
  <button class="go" type="submit">${p.name ? 'Save profile' : "Let's go →"}</button>
  </form>`;
  document.body.appendChild(el);
  const x = el.querySelector('#obX'); if (x) x.onclick = () => el.remove();
  el.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), n = k => parseFloat(f.get(k));
    const np = { name: String(f.get('name') || '').trim(), age: n('age'), ft: n('ft'), inch: n('inch') || 0, weight: n('weight'), created: p.created || new Date().toISOString() };
    const bad = !(np.age >= 14 && np.age <= 90) ? 'Please enter a valid age.' : !(np.ft >= 4 && np.ft <= 7) || np.inch < 0 || np.inch > 11 ? 'Please enter your height (ft + in).' : !(np.weight >= 70 && np.weight <= 500) ? 'Please enter your current weight in lb.' : '';
    if (bad) { el.querySelector('#obErr').textContent = bad; return; }
    localStorage.setItem(PKEY, JSON.stringify(np));
    location.reload();
  };
}

const prof = getProfile();
if (prof) personalize(prof); else window.SHREDHER_ONBOARD = true;
document.addEventListener('DOMContentLoaded', () => { if (!getProfile()) showOnboarding(null); });
})();
</script>
<script>(() => {
'use strict';
const P = window.PLAN;
const IMG = f => (window.SHREDHER_IMGS && window.SHREDHER_IMGS[f]) || 'assets/demos/' + f;
const KEY = 'shredher.v1';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a, b) => Math.round((parse(ymd(a)) - parse(ymd(b))) / 864e5);
const nice = s => { const d = parse(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const today = () => { const q = new URLSearchParams(location.search).get('date'); return q ? parse(q) : new Date(); };

/* ---------- state ---------- */
let S = load();
function load(){
  let s; try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  s = s || {};
  s.settings = Object.assign({ start: ymd(mondayOf(today())), rest: 90, sound: true }, s.settings);
  s.days = s.days || {}; s.workouts = s.workouts || []; s.groceries = s.groceries || {}; s.cook = s.cook || {};
  return s;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
const day = k => (S.days[k] = S.days[k] || { meals: {}, extra: [] });

/* ---------- plan logic ---------- */
function weekNum(d){ const n = diffDays(d, parse(S.settings.start)); return n < 0 ? 0 : Math.floor(n/7)+1; }
function phase(w){ if (w >= 7) return P.ramp[3]; if (w >= 5) return P.ramp[2]; if (w >= 3) return P.ramp[1]; return P.ramp[0]; }
function sessionFor(d){
  const w = Math.max(1, weekNum(d)), dow = d.getDay();
  const e = P.schedule.find(x => x.dow === dow);
  if (!e) return null;
  return w >= e.from ? { id: e.session, ...e } : { id: e.session, locked: true, ...e };
}
function macrosFor(k){
  const rec = S.days[k]; const t = { kcal:0, protein:0, fat:0, carbs:0, sodium:0 };
  if (!rec) return t;
  const plan = P.week[parse(k).getDay()];
  P.mealSlots.forEach(sl => { if (rec.meals && rec.meals[sl.key]) { const m = P.meals[plan[sl.key][0]]; for (const x in t) t[x] += m[x]; } });
  (rec.extra || []).forEach(e => { for (const x in t) t[x] += +e[x] || 0; });
  return t;
}

/* ---------- workouts ---------- */
const exKey = n => n.toLowerCase().replace(/[^a-z0-9]/g, '');
function lastLog(name, beforeDate, excludeId){
  const k = exKey(name);
  const ws = S.workouts.filter(w => w.id !== excludeId && w.date <= beforeDate).sort((a,b) => b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  for (const w of ws){
    const e = w.exercises.find(x => exKey(x.name) === k);
    if (e && e.sets.some(s => s.done)) return { date: w.date, sets: e.sets.filter(s => s.done) };
  }
  return null;
}
function getWorkout(date, sid, create){
  let w = S.workouts.find(x => x.date === date && x.session === sid);
  if (!w && create){
    const sess = P.sessions[sid];
    w = { id: date + ':' + sid, date, session: sid, ts: Date.now(), exercises: sess.exercises.map(e => {
      const last = lastLog(e.name, date);
      const lw = last ? (last.sets.filter(s => s.weight !== '' && s.weight != null).map(s => s.weight).pop() ?? '') : '';
      return { name: e.name, sets: Array.from({ length: e.sets }, () => ({ done: false, reps: e.reps ?? '', weight: lw })) };
    }) };
    S.workouts.push(w); save();
  }
  return w;
}
function hintFor(ex, last){
  const bw = ex.bodyweight || ex.ab;
  if (ex.ab) {
    const top = 15;
    if (last){ const min = Math.min(...last.sets.map(s => +s.reps || 0)); if (min >= top) return { up:true, t:`You hit ${top}+ on every set last time → add weight (or a harder variation) and reset to ${ex.reps} reps.` }; return { t:`Last: ${last.sets.map(s => s.reps).join(' / ')} reps. Add 1–2 reps per set this week (top of range: 3×15).` }; }
    return { t:'Ab rule: progress to 3×15, then add weight.' };
  }
  if (!last) return { t: ex.reps ? `First log: pick a weight you can do for ${ex.target} with 1–2 reps left in the tank.` : 'First log: go to technical failure on each set.' };
  const ws = last.sets.map(s => +s.weight || 0), w = Math.max(...ws);
  const allHit = ex.reps ? last.sets.length >= ex.sets && last.sets.every(s => (+s.reps || 0) >= ex.reps) : false;
  if (allHit && !bw) return { up:true, t:`Last time (${nice(last.date)}) you hit all ${ex.sets}×${ex.reps} at ${w} lb → try ${w + (w >= 100 ? 5 : 2.5)} lb today.` };
  if (!ex.reps) return { t:`Last: ${last.sets.map(s => s.reps || '✓').join(' / ')} reps${w ? ' @ ' + w + ' lb' : ''}. Beat at least one set.` };
  return { t:`Last (${nice(last.date)}): ${last.sets.map(s => (s.reps || '✓')).join(' / ')}${w ? ' @ ' + w + ' lb' : ''}. Stay here until you hit all ${ex.sets}×${ex.reps}.` };
}

/* ---------- ui helpers ---------- */
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }
function ring(size, stroke, pct, color, inner){
  const r = (size - stroke)/2, c = 2*Math.PI*r, off = c * (1 - Math.min(1, Math.max(0, pct)));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="ctr">${inner}</div></div>`;
}
function animateRings(root){ requestAnimationFrame(() => requestAnimationFrame(() => { $$('.fg[data-off]', root).forEach(c => c.style.strokeDashoffset = c.dataset.off); $$('.bar>i[data-w]', root).forEach(b => b.style.width = b.dataset.w); })); }
const fmt = n => Math.round(n).toLocaleString();
function setHeader(kicker, title){ $('#tbKicker').textContent = kicker; $('#tbTitle').textContent = title; }

/* ---------- views ---------- */
const views = {};
let wState = { sid: null, date: null };
let mealDay = null;

views.today = () => {
  const d = today(), k = ymd(d), w = weekNum(d), ph = phase(Math.max(1,w)), sess = sessionFor(d);
  setHeader(`${DOWL[d.getDay()]} · ${MON[d.getMonth()]} ${d.getDate()}`, (P.profile && P.profile.name ? `Hi, ${P.profile.name}` : 'Today'));
  const rec = day(k), m = macrosFor(k), T = P.targets, plan = P.week[d.getDay()];
  const wk = w === 0 ? `Starts ${nice(S.settings.start)}` : `Week ${w} · ${ph.weeks}`;
  let sessHtml;
  if (sess && !sess.locked){
    const s = P.sessions[sess.id], wo = getWorkout(k, sess.id, false);
    const tot = s.exercises.reduce((a,e) => a + e.sets, 0), dn = wo ? wo.exercises.reduce((a,e) => a + e.sets.filter(x => x.done).length, 0) : 0;
    sessHtml = `<div class="chips"><span class="chip lime">${s.emoji} Lift day</span><span class="chip">${s.exercises.length} exercises · ${tot} sets</span>${sess.assumed ? '<span class="chip amber">Day assumed</span>' : ''}</div>
      <div class="big">${esc(s.name)}</div>
      <div class="muted small">~35–45 min · ${esc(P.ramp[0].weeks)}</div>
      <div class="progress-line"><i style="width:${tot ? dn/tot*100 : 0}%"></i></div>
      <div class="row between" style="margin-top:14px"><span class="small muted">${dn}/${tot} sets done</span><a class="btn primary sm" href="#workout">${dn ? 'Continue' : 'Start workout'} →</a></div>`;
  } else {
    const isSun = d.getDay() === 0;
    const extra = w >= 3 && (d.getDay() === 2 || d.getDay() === 4) ? ' Good slot for the 25-min incline walk.' : '';
    sessHtml = `<div class="chips"><span class="chip cyan">${isSun ? '🧘 Rest' : '🚶 Recovery'}</span>${sess && sess.locked ? `<span class="chip">${esc(P.sessions[sess.id].name)} unlocks week ${sess.from}</span>` : ''}</div>
      <div class="big">${isSun ? 'Rest / meal prep' : 'No lift today'}</div>
      <div class="muted small">${isSun ? 'Sunday main prep ≈2–2¼ hr. Hit your steps.' : 'Lunch walk 20–30 min + 8–10k steps.' + extra}</div>
      ${isSun || d.getDay() === 2 || d.getDay() === 6 ? `<div class="row" style="margin-top:14px"><a class="btn sm" href="#cook">Open cook plan →</a></div>` : ''}`;
  }
  const kp = m.kcal / T.kcal;
  const mini = [['Protein', m.protein, T.protein, 'g', 'var(--cyan)'], ['Carbs', m.carbs, T.carbs, 'g', 'var(--amber)'], ['Fat', m.fat, T.fat, 'g', 'var(--violet)']];
  const steps = +rec.steps || 0;
  return `<div class="stagger">
  <section class="card hero"><div class="row between" style="margin-bottom:10px"><span class="tiny muted" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">${wk}</span><span class="tiny dim">${ph.lift} lift days/wk</span></div>${sessHtml}</section>

  <section class="card"><h2>Fuel</h2>
    <div class="rings">
      ${ring(150, 14, kp, 'url(#gl)', `<b>${fmt(m.kcal)}</b><span>of ${fmt(T.kcal)} kcal</span>`)}
      <div class="minirings">${mini.map(([l,v,t,u,c]) => `<div class="mr">${ring(44, 6, v/t, c, `<b>${Math.round(v/t*100)}%</b>`)}<div><div class="lbl">${l}</div><div class="val">${Math.round(v)} / ${t} ${u}</div></div></div>`).join('')}</div>
    </div>
    <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fb5"/><stop offset="1" stop-color="#c9a7ff"/></linearGradient></defs></svg>
    <div style="margin-top:16px"><div class="row between small" style="margin-bottom:6px"><span class="muted">Sodium</span><span><b>${fmt(m.sodium)}</b> <span class="dim">/ ${fmt(T.sodium)} mg</span></span></div><div class="bar"><i data-w="${Math.min(100, m.sodium/T.sodium*100)}%" style="background:var(--pink)"></i></div></div>
  </section>

  <section class="card"><div class="row between"><h2 style="margin:0">Today's meals</h2><a class="small" style="color:var(--lime);font-weight:700" href="#meals">Week plan</a></div>
    <div style="margin-top:6px">${P.mealSlots.map(sl => { const [code, note] = plan[sl.key], ml = P.meals[code], on = rec.meals[sl.key];
      return `<div class="item tap ${on ? 'on' : ''}" data-meal="${sl.key}"><div class="check">${CHECK}</div><div class="grow"><div class="t">${esc(ml.name)}</div><div class="s">${sl.label}${note ? ' · ' + esc(note) : ''}</div></div><div class="kc"><b>${ml.kcal}</b><span>${ml.protein} g P</span></div></div>`; }).join('')}
    ${(rec.extra||[]).map((e,i) => `<div class="item"><div class="badge a">+</div><div class="grow"><div class="t">${esc(e.label || 'Extra')}</div><div class="s">${e.protein||0} g P · ${e.carbs||0} g C · ${e.fat||0} g F</div></div><div class="kc"><b>${e.kcal||0}</b><button class="tiny dim" data-delextra="${i}">remove</button></div></div>`).join('')}
    </div>
    <button class="btn sm ghost" id="addExtra" style="margin-top:8px;padding:0;color:var(--mut)">+ Log something extra</button>
  </section>

  <section class="card"><h2>Quick log</h2>
    <div class="inp-row">
      <div class="field"><label>Morning weight (lb)</label><input class="inp" id="qWeight" type="number" inputmode="decimal" step="0.1" placeholder="—" value="${rec.weight ?? ''}"></div>
      <div class="field"><label>Steps</label><input class="inp" id="qSteps" type="number" inputmode="numeric" placeholder="0" value="${rec.steps ?? ''}"></div>
    </div>
    <div style="margin-top:14px"><div class="row between small" style="margin-bottom:6px"><span class="muted">Steps goal 8–10k</span><span><b>${fmt(steps)}</b> <span class="dim">/ 10,000</span></span></div><div class="bar"><i data-w="${Math.min(100, steps/10000*100)}%" style="background:linear-gradient(90deg,var(--cyan),var(--lime))"></i></div></div>
    <div class="chips" style="margin-top:12px">${[1000,2500,5000].map(n => `<button class="chip" data-addsteps="${n}">+${n/1000}k steps</button>`).join('')}</div>
    <button class="btn primary block" id="qSave" style="margin-top:14px">Save</button>
  </section>
  </div>`;
};
views.today.bind = root => {
  const k = ymd(today()), rec = day(k);
  $$('[data-meal]', root).forEach(el => el.onclick = () => { rec.meals[el.dataset.meal] = !rec.meals[el.dataset.meal]; save(); render(true); });
  $$('[data-delextra]', root).forEach(el => el.onclick = () => { rec.extra.splice(+el.dataset.delextra, 1); save(); render(true); });
  $$('[data-addsteps]', root).forEach(el => el.onclick = () => { const i = $('#qSteps'); i.value = (+i.value || 0) + +el.dataset.addsteps; });
  $('#qSave', root).onclick = () => {
    const w = $('#qWeight').value, st = $('#qSteps').value;
    rec.weight = w === '' ? undefined : +w; rec.steps = st === '' ? undefined : +st; save(); toast('Logged ✓'); render(true);
  };
  $('#addExtra', root).onclick = () => openSheet(`<h3>Log extra food</h3><p class="muted small">Anything off-plan (label macros are fine).</p>
    <div class="grp"><div class="field"><label>What</label><input class="inp" id="xL" placeholder="e.g. Protein bar" style="font-size:16px;font-weight:600"></div></div>
    <div class="grp inp-row"><div class="field"><label>kcal</label><input class="inp" id="xK" type="number" inputmode="numeric"></div><div class="field"><label>Protein g</label><input class="inp" id="xP" type="number" inputmode="decimal"></div></div>
    <div class="grp inp-row"><div class="field"><label>Carbs g</label><input class="inp" id="xC" type="number" inputmode="decimal"></div><div class="field"><label>Fat g</label><input class="inp" id="xF" type="number" inputmode="decimal"></div><div class="field"><label>Sodium mg</label><input class="inp" id="xN" type="number" inputmode="numeric"></div></div>
    <div class="grp"><button class="btn primary block" id="xSave">Add</button></div>`, sh => {
      $('#xSave', sh).onclick = () => { rec.extra.push({ label: $('#xL').value, kcal: +$('#xK').value||0, protein: +$('#xP').value||0, carbs: +$('#xC').value||0, fat: +$('#xF').value||0, sodium: +$('#xN').value||0 }); save(); closeSheet(); render(true); };
    });
};

views.workout = () => {
  const d = today(), k = ymd(d), sess = sessionFor(d);
  if (!wState.sid || wState.date !== k){ wState = { sid: sess && !sess.locked ? sess.id : null, date: k }; }
  const w = Math.max(1, weekNum(d));
  const order = ['chest-shoulders','back-abs','legs-arm','chest-abs','back','legs-arms'];
  const picker = `<div class="hscroll">${order.map(id => { const s = P.sessions[id], sch = P.schedule.find(x => x.session === id), lk = w < sch.from;
    return `<button class="spill ${wState.sid === id ? 'sel' : ''}" data-sid="${id}">${s.emoji} ${esc(s.name)} <span class="lk">${lk ? '🔒 wk' + sch.from : sch.extra ? 'extra' : DOW[sch.dow]}</span></button>`; }).join('')}</div>`;
  if (!wState.sid){
    setHeader(`${DOWL[d.getDay()]} · Week ${w}`, 'Workout');
    return `${picker}<div class="card empty"><div class="e">${d.getDay() === 0 ? '🧘' : '🚶'}</div><div style="font-weight:700;font-size:18px;color:var(--txt)">No lift scheduled today</div><p class="small">Pick any session above to train anyway, or hit your lunch walk & steps.</p></div>`;
  }
  const s = P.sessions[wState.sid], wo = getWorkout(k, wState.sid, true);
  const sch = P.schedule.find(x => x.session === wState.sid);
  setHeader(`${DOW[d.getDay()]} · Week ${w} · ${phase(w).weeks}`, s.name);
  const tot = s.exercises.reduce((a,e) => a + e.sets, 0), dn = wo.exercises.reduce((a,e) => a + e.sets.filter(x => x.done).length, 0);
  return `${picker}
  ${dn === tot ? `<div class="done-banner">🏆 Session complete. Nice work — log your steps & dinner.</div>` : ''}
  <div class="card pad-s"><div class="row between"><div><div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">Progress</div><div style="font-size:20px;font-weight:800;margin-top:2px">${dn} / ${tot} sets</div></div><div class="chips"><span class="chip">Rest ${S.settings.rest}s</span>${sch.assumed ? '<span class="chip amber">Day TBD</span>' : ''}</div></div><div class="progress-line"><i style="width:${dn/tot*100}%"></i></div>
  ${s.progression ? `<p class="small muted" style="margin:12px 0 0;line-height:1.45"><b style="color:var(--txt)">Progression:</b> ${esc(s.progression)}</p>` : `<p class="small muted" style="margin:12px 0 0;line-height:1.45"><b style="color:var(--txt)">Dashboard ab rule:</b> ${esc(P.abRule.replace(/^Ab work 3x\/week: /,''))}</p>`}</div>
  <div class="stagger">${s.exercises.map((ex, i) => {
    const log = wo.exercises[i], last = lastLog(ex.name, k, wo.id), h = hintFor(ex, last), exDone = log.sets.every(x => x.done);
    const lastTxt = last ? `Last ${nice(last.date)}: ${last.sets.map(x => (x.weight ? x.weight + '×' : '') + (x.reps || '✓')).join(', ')}` : 'No previous log';

function weightSeries(){
  return Object.keys(S.days).filter(k => S.days[k].weight).sort().map(k => ({ k, w: +S.days[k].weight }));

function avg7(series, k){ const end = parse(k), start = addDays(end, -6); const xs = series.filter(p => { const d = parse(p.k); return d >= start && d <= end; }); return xs.length ? xs.reduce((a, p) => a + p.w, 0) / xs.length : null; }
function chart(series){
  if (series.length < 1) return `<div class="empty"><div class="e">⚖️</div>Log your morning weight on the Today tab to see the trend.</div>`;
  const W = 358, H = 200, pl = 34, pr = 10, pt = 12, pb = 24;
  const first = parse(series[0].k), last = parse(series[series.length - 1].k);
  const span = Math.max(6, diffDays(last, first));
  const avgs = series.map(p => ({ k: p.k, a: avg7(series, p.k) }));
  const vals = series.map(p => p.w).concat(avgs.map(p => p.a));
  let lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const x = k => pl + diffDays(parse(k), first) / span * (W - pl - pr), y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const step = Math.max(1, Math.round((hi - lo) / 4));
  let g = ''; for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const path = avgs.map((p, i) => (i ? 'L' : 'M') + x(p.k).toFixed(1) + ',' + y(p.a).toFixed(1)).join('');
  const area = path + `L${x(avgs[avgs.length - 1].k).toFixed(1)},${H - pb}L${x(avgs[0].k).toFixed(1)},${H - pb}Z`;
  const lbls = [series[0].k, series[series.length - 1].k].map((k, i) => `<text class="axis" x="${x(k)}" y="${H - 6}" text-anchor="${i ? 'end' : 'start'}">${MON[parse(k).getMonth()]} ${parse(k).getDate()}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6fb5" stop-opacity=".28"/><stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#ff6fb5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="draw"/>
    ${series.map(p => `<circle cx="${x(p.k)}" cy="${y(p.w)}" r="3" fill="#150a1f" stroke="#c9a7ff" stroke-width="1.6"/>`).join('')}${lbls}</svg>
    <div class="legend"><span><i style="background:#ff6fb5"></i>7-day average</span><span><i style="background:#c9a7ff"></i>Daily weigh-in</span></div>`;
}

/* ---------- export / import ---------- */
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const csvCell = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportData(kind){
  const stamp = ymd(new Date());
  if (kind === 'json') { download(`shred-logs-${stamp}.json`, JSON.stringify({ app: 'shred', version: 1, exported: new Date().toISOString(), ...S }, null, 2), 'application/json'); toast('JSON exported'); return; }
  const rows = [['type','date','weekday','week','weight_lb','steps','kcal','protein_g','fat_g','carbs_g','sodium_mg','meals_eaten','session','exercise','set','weight_set_lb','reps','done']];
  Object.keys(S.days).sort().forEach(k => { const r = S.days[k], m = macrosFor(k); rows.push(['day', k, DOW[parse(k).getDay()], weekNum(parse(k)), r.weight ?? '', r.steps ?? '', m.kcal, m.protein, m.fat, m.carbs, m.sodium, Object.keys(r.meals || {}).filter(x => r.meals[x]).join(' '), '', '', '', '', '', '']); });
  [...S.workouts].sort((a, b) => a.date.localeCompare(b.date)).forEach(w => w.exercises.forEach(e => e.sets.forEach((s, i) => rows.push(['set', w.date, DOW[parse(w.date).getDay()], weekNum(parse(w.date)), '', '', '', '', '', '', '', '', P.sessions[w.session].name, e.name, i + 1, s.weight, s.reps, s.done ? 1 : 0]))));
  download(`shred-logs-${stamp}.csv`, rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv'); toast('CSV exported');
}

/* ---------- rest timer ---------- */
let tEnd = 0, tTotal = 0, tInt = null, actx = null;
function startTimer(sec){
  tTotal = sec; tEnd = Date.now() + sec * 1000; const el = $('#timer'); el.classList.remove('hidden', 'done');
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000)), el = $('#timer');
  $('#timerTime').textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $('#timerArc').style.strokeDashoffset = 119.4 * (1 - left / Math.max(1, tTotal));
  if (left <= 0 && !el.classList.contains('done')) {
    el.classList.add('done'); $('.timer-label').textContent = 'Go!'; if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    if (actx) { [0, .18, .36].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + .15); o.connect(g).connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .16); }); }
    clearInterval(tInt); setTimeout(() => { if (el.classList.contains('done')) stopTimer(); }, 6000);
  } else if (left > 0) $('.timer-label').textContent = 'Rest';
}
function stopTimer(){ clearInterval(tInt); $('#timer').classList.add('hidden'); }
$$('.timer-btn').forEach(b => b.onclick = () => { const t = b.dataset.t; if (t === 'skip') return stopTimer(); tEnd += +t * 1000; tTotal = Math.max(tTotal, Math.round((tEnd - Date.now()) / 1000)); if (tEnd < Date.now()) tEnd = Date.now(); $('#timer').classList.remove('done'); clearInterval(tInt); tick(); tInt = setInterval(tick, 250); });

/* ---------- router ---------- */
const TABS = ['today','workout','meals','groceries','cook','progress'];
let curTab = null;
function render(anim){
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today';
  const v = $('#view');
  v.innerHTML = views[tab]();
  views[tab].bind && views[tab].bind(v);
  if (anim !== false && (anim || tab !== curTab)) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
  if (tab !== curTab) window.scrollTo(0, 0);
  curTab = tab;
  $$('.tabbar a').forEach((a, i) => { const on = a.dataset.tab === tab; a.classList.toggle('act', on); if (on) $('#tabInd').style.transform = `translateX(${i * 100}%)`; });
  animateRings(v);
}
window.addEventListener('hashchange', () => render(true));
$('#settingsBtn').onclick = openSettings;
$('#sheet').addEventListener('click', e => { if (e.target.hasAttribute('data-close')) closeSheet(); });
$('#lightbox').onclick = () => $('#lightbox').classList.add('hidden');
document.addEventListener('visibilitychange', () => { if (!document.hidden && curTab === 'today') render(false); });
if (!localStorage.getItem(KEY)) save();
render(true);

if (false && 'serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
